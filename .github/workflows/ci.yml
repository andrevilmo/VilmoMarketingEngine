name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  agent:
    name: agent-lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check agent
      - name: Test agent
        env:
          LLM_PROVIDER: mock
        run: PYTHONPATH=. pytest agent/tests -q
      - name: Build validation (import app)
        run: PYTHONPATH=. python -c "from agent.app.main import app; print(app.title)"
      - name: DevOps trend estimate
        run: PYTHONPATH=. python docs/devops/estimate_failure_trend.py
