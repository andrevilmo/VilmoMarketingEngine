server {
    listen 80 default_server;
    server_name _;
    default_type application/json;
    server_tokens off;
    add_header Cache-Control "no-store";

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 200 '{"service":"$hostname","path":"$request_uri"}\n';
    }
}
