worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    server_tokens off;

    log_format main '$remote_addr $host $request $status $body_bytes_sent '
                    'upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    upstream vilmo_web    { server vilmo-web:80; }
    upstream vilmo_api    { server vilmo-api:80; }
    upstream vilmo_nfe    { server vilmo-nfe:80; }
    upstream vilmo_worker { server vilmo-worker:80; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    server {
        listen 80 default_server;
        server_name vilmomkt.com www.vilmomkt.com _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name vilmomkt.com www.vilmomkt.com _;

        ssl_certificate     /etc/letsencrypt/live/vilmomkt.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vilmomkt.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=15552000" always;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "vilmo-gateway\n";
        }

        location = / {
            return 302 /web/;
        }

        location = /web     { return 301 /web/; }
        location /web/ {
            proxy_set_header X-Forwarded-Prefix /web;
            proxy_pass http://vilmo_web/;
        }

        location = /api     { return 301 /api/; }
        location /api/ {
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_pass http://vilmo_api/;
        }

        location = /nfe     { return 301 /nfe/; }
        location /nfe/ {
            proxy_set_header X-Forwarded-Prefix /nfe;
            proxy_pass http://vilmo_nfe/;
        }

        location = /worker     { return 301 /worker/; }
        location /worker/ {
            proxy_set_header X-Forwarded-Prefix /worker;
            proxy_pass http://vilmo_worker/;
        }

        location /webhooks/ {
            proxy_set_header X-Forwarded-Prefix "";
            proxy_buffering off;
            proxy_pass http://vilmo_api/webhooks/;
        }

        location /oauth/ {
            proxy_set_header X-Forwarded-Prefix "";
            proxy_pass http://vilmo_api/oauth/;
        }
    }
}
