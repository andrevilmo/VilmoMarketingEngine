# Only vilmo-gateway publishes a host port (80).
# Backends, Postgres, and Redis stay on the Docker network.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Public slugs:
#   /web     vilmo-web
#   /api     vilmo-api
#   /nfe     vilmo-nfe
#   /worker  vilmo-worker
#   /webhooks/{code}  and  /oauth/{code}/callback  → vilmo-api (marketplace URLs)

name: vilmo

x-http-stub: &http-stub
  image: vilmo-http-stub
  build:
    context: ./stubs
  networks:
    - vilmo
  expose:
    - "80"
  restart: unless-stopped

services:
  vilmo-gateway:
    image: vilmo-gateway
    build:
      context: ./gateway
    container_name: vilmo-gateway
    hostname: vilmo-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      vilmo-web:
        condition: service_started
      vilmo-api:
        condition: service_started
      vilmo-nfe:
        condition: service_started
      vilmo-worker:
        condition: service_started
    networks:
      - vilmo
    restart: unless-stopped

  vilmo-web:
    <<: *http-stub
    container_name: vilmo-web
    hostname: vilmo-web

  vilmo-api:
    <<: *http-stub
    container_name: vilmo-api
    hostname: vilmo-api

  vilmo-nfe:
    <<: *http-stub
    container_name: vilmo-nfe
    hostname: vilmo-nfe

  vilmo-worker:
    <<: *http-stub
    container_name: vilmo-worker
    hostname: vilmo-worker

  postgres:
    image: postgres:16-alpine
    container_name: vilmo-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: vilmo
      POSTGRES_PASSWORD: vilmo
      POSTGRES_DB: vilmo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vilmo
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vilmo -d vilmo"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: vilmo-redis
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - vilmo
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  vilmo:
    name: vilmo-internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
